[project]
name = "claudeoptim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.0",
    "claude-agent-sdk>=0.1.10",
    "docker>=7.1.0",
    "dspy>=3.0.4",
    "fastapi>=0.124.0",
    "gepa>=0.0.17",
    "gitpython>=3.1.46",
    "uvicorn>=0.32.0",
    "websockets>=15.0.1",
]

[project.scripts]
sbclaude-server = "sbclaude.server:main"
sbclient = "sbclient.client:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
